name: Build, push and deploy to ECS (documenso stack)

# On every push to `production` (or manual dispatch): build the Docker image,
# push it to ECR as :<git-sha>, then deploy it with an image-only update of the
# `documenso` CloudFormation stack in drschoice/devops (its README, "Deploying a
# new image"). Never deploy with update-express-gateway-service or the ECS
# deploy action: the next stack update would silently revert it.
#
# Auth is via GitHub OIDC (no stored AWS keys). Account-specific values are kept
# out of this public repo, in repository secrets:
#   AWS_DEPLOY_ROLE_ARN        ECR push role (github-documenso-deploy)
#   AWS_STACK_DEPLOY_ROLE_ARN  stack update role (gha-deploy-documenso-production,
#                              drschoice/devops stacks/ci-deploy, devops#55);
#                              it trusts pushes to `production` only

on:
  push:
    branches: [production]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: documenso
  STACK: documenso

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    # A newer push supersedes an older build: no value in pushing a stale image.
    concurrency:
      group: build-push-ecr
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: . # repo root: docker/Dockerfile does `COPY . .`
          file: ./docker/Dockerfile
          platforms: linux/amd64 # the ECS task is X86_64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Every other stack parameter keeps its value (update-stack would reset an
  # omitted one to its default, e.g. a live Weight of 100 to 0). It starts the
  # update and ends rather than paying for the ~10-minute rollout
  # (drschoice/devops#81): a rollback is posted to Slack #uptime by devops
  # stacks/monitoring, not shown in this run. A push of an image the stack
  # already runs is a no-op.
  ecs:
    name: Deploy to the documenso stack
    needs: build
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One run at a time, never cancelled. The job doesn't outlive its update,
    # so the step also waits out one an earlier run left in progress.
    concurrency:
      group: ecs-deploy-documenso
      cancel-in-progress: false
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_STACK_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update the stack's ImageUri
        run: |
          set -euo pipefail
          account=$(aws sts get-caller-identity --query Account --output text)
          image="$account.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$GITHUB_SHA"
          # CloudFormation refuses an update while another is running.
          while :; do
            status=$(aws cloudformation describe-stacks --stack-name "$STACK" \
                --query 'Stacks[0].StackStatus' --output text)
            [[ $status == *_IN_PROGRESS ]] || break
            echo "$STACK is $status; waiting for it to finish"
            sleep 20
          done
          if [[ $status == UPDATE_ROLLBACK_COMPLETE ]]; then
            echo "::warning::$STACK's previous update rolled back; deploying $ECR_REPOSITORY:$GITHUB_SHA anyway."
          fi
          params=("ParameterKey=ImageUri,ParameterValue=$image")
          for key in $(aws cloudformation describe-stacks --stack-name "$STACK" \
              --query "Stacks[0].Parameters[?ParameterKey!='ImageUri'].ParameterKey" --output text); do
            params+=("ParameterKey=$key,UsePreviousValue=true")
          done
          if ! out=$(aws cloudformation update-stack --stack-name "$STACK" --use-previous-template \
              --capabilities CAPABILITY_NAMED_IAM --parameters "${params[@]}" 2>&1); then
            if grep -q 'No updates are to be performed' <<<"$out"; then
              echo "$STACK already runs $ECR_REPOSITORY:$GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "$out" >&2
            exit 1
          fi
          echo "Started deploying $ECR_REPOSITORY:$GITHUB_SHA to $STACK. A rollback is posted to Slack #uptime, not shown here." \
            | tee -a "$GITHUB_STEP_SUMMARY"
