name: Build and push image to ECR (App Runner auto-deploys)

# On every push to `production` (or manual dispatch): build the Docker image and
# push it to ECR under TWO tags —
#   :<git-sha>    immutable, for traceability and rollback
#   :production   moving tag that App Runner watches
# App Runner is configured with Deployment trigger = Automatic against the
# `:production` tag, so it redeploys itself whenever this workflow pushes a new
# image. There is deliberately NO deploy step here — App Runner owns the rollout.
#
# Auth is via GitHub OIDC (no stored AWS keys). Account-specific values are kept
# OUT of this public repo and come from a GitHub Actions repository secret
# (Settings → Secrets and variables → Actions):
#   AWS_DEPLOY_ROLE_ARN  — CloudFormation output GitHubDeployRoleArn (needs ECR push)
# The old ECS_SERVICE_ARN / APP_SECRET_ARN secrets are no longer used here (App
# Runner holds the container config); they can be removed.

on:
  push:
    branches: [production]
  workflow_dispatch: {}

concurrency:
  group: build-push-ecr
  # A newer push supersedes an older queued/running build — no value in pushing a
  # stale image after a fresher commit landed.
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
  ECR_REPOSITORY: documenso
  # The moving tag App Runner is configured to watch for automatic deployments.
  DEPLOY_TAG: production

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: . # repo root — docker/Dockerfile does `COPY . .`
          file: ./docker/Dockerfile
          platforms: linux/amd64 # App Runner service is X86_64
          push: true
          # Push both the immutable SHA tag and the moving tag App Runner watches.
          # A push to :production is what triggers App Runner's automatic deploy.
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.DEPLOY_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
